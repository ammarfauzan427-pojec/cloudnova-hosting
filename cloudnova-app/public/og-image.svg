    <path d="M35 22 C30 22 26 25 25 29 C21 30 18 34 18 38 C18 43 22 47 27 47 L45 47 C49 47 53 44 53 39 C53 35 50 32 46 32 C46 26 41 22 35 22 Z" fill="#FFFFFF" />
    <text x="85" y="47" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">CloudNova<tspan fill="#5794FF">.</tspan></text>
  </g>

